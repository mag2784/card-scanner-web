name: Daily price copy
# Browsers can't read TCGCSV directly, so every day this saves a compact copy of TCGplayer's Pokémon prices
# (scripts/prices.mjs) to the `prices` branch, where the web app reads it.
on:
  schedule:
    - cron: '30 21 * * *'          # every day, after TCGCSV's daily update
  workflow_dispatch:
  push:                            # and right away when the script or this file changes
    branches: [main]
    paths: ['scripts/prices.mjs', '.github/workflows/prices.yml']
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/prices.mjs out
      - name: Publish to the prices branch (one commit, replaced each day)
        run: |
          cd out
          git init -q -b prices
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Prices $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" prices
